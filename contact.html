<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Explore Nature</title>
    <link rel="stylesheet" href="assets/styles.css">
</head>

<body>
    <!-- Navigation section -->
    <nav>
        <div class="logo"> Bonfire </div>
        <div>
            <a href="">Home</a>
            <a href="">Destinations</a>
            <a href="">Our Story</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
    <!-- Hero section -->
    <section class="hero-contact">
        <div>
            <h1>Contact Us</h1>
            <p>We'd love to hear from you! Get in touch with our team.</p>
        </div>
    </section>

    <section class="container">
        <!-- Main section -->
        <div class="left">
            <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D"
                alt="">
            <h2>Please Get In Touch</h2>
            <p>Phone:0712345678</p>
            <p>Email: info@bonfire.com</p>
        </div>
        <div class="right">
            <form action="">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" 
                    style="width: 95%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;"
                    required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email"
                    style="width: 95%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;"
                    required>

                <label for="suggestion">Message:</label>
                <textarea id="suggestion" name="suggestion" rows="10"
                    style="width: 95%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #ccc;"
                    required> </textarea>

                <button type="submit" class="button">POST</button>
            </form>
        </div>

    </section>

</body>

</html>
